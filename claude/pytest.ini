[pytest]
testpaths = tests
# --capture=sys (not the default "fd"): on at least one Windows + CPython
# combination we tested against, pytest's default fd-level output capture
# (which duplicates OS file descriptors 1/2) intermittently collides with
# subprocess pipe creation for tests that shell out to git/python — seen as
# "OSError: [WinError 6] The handle is invalid" from subprocess.Popen, only
# under pytest, never when the same subprocess calls are run standalone.
# sys-level capture (monkeypatches sys.stdout/stderr in Python instead of
# duplicating fds) still shows captured print() output on failure and
# avoids the conflict entirely — confirmed to fully eliminate the
# flakiness in repeated local runs. If you ever see a stray
# "WinError 6"/"handle is invalid" from a test, you're probably running
# with this overridden back to fd capture.
addopts = --capture=sys
